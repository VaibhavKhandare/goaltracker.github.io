<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eat the Frog Tracker</title>
<style>
:root{--bg:#f5f5f4;--panel:#fff;--ink:#171717;--muted:#737373;--line:#e5e5e5;--soft:#f0f0ef;--dark:#171717;--good:#166534;--warn:#92400e;--bad:#991b1b;--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.shell{max-width:1180px;margin:auto;padding:28px 22px 70px}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;border-radius:12px;background:#171717;color:white;display:grid;place-items:center;font-weight:800;font-size:18px}
h1{font-size:19px;margin:0;letter-spacing:-.5px} .sub{color:var(--muted);font-size:12px}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:600}
.btn.primary{background:var(--dark);color:white;border-color:var(--dark)}.btn.ghost{background:transparent}.btn.small{padding:6px 9px;font-size:12px}
.tabs{display:flex;gap:5px;padding:5px;background:#eaeae8;border-radius:12px;width:max-content;margin-bottom:20px;max-width:100%;overflow:auto}
.tab{border:0;background:transparent;color:#666;padding:9px 14px;border-radius:9px;font-weight:650;white-space:nowrap}.tab.active{background:white;color:#171717;box-shadow:0 1px 3px #00000012}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.panel h2{font-size:15px;margin:0 0 4px;letter-spacing:-.2px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}
.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:750;margin:18px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:13px}.stat strong{display:block;font-size:23px;letter-spacing:-1px}.stat span{font-size:11px;color:var(--muted)}
.task-list{display:flex;flex-direction:column;gap:9px}.task{border:1px solid var(--line);border-radius:13px;padding:12px 13px;display:flex;gap:11px;align-items:flex-start}.task.done{opacity:.62}.task.done .task-title{text-decoration:line-through}
.check{width:19px;height:19px;border:1.5px solid #b8b8b8;border-radius:6px;flex:0 0 auto;margin-top:2px;display:grid;place-items:center;background:white;color:white}.check.checked{background:#171717;border-color:#171717}
.task-main{flex:1;min-width:0}.task-title{font-weight:700;font-size:13px;overflow-wrap:anywhere}.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.pill{font-size:10px;padding:3px 7px;border-radius:20px;background:var(--soft);color:#555;font-weight:700}.pill.a{background:#fce8e8;color:var(--bad)}.pill.b{background:#fff3dc;color:var(--warn)}.pill.c{background:#eee;color:#555}.pill.d,.pill.e{background:#e9e9e9;color:#666}
.task-actions{display:flex;gap:4px}.iconbtn{border:0;background:transparent;color:#777;padding:4px;border-radius:6px}.iconbtn:hover{background:#eee;color:#111}
.empty{padding:25px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:11px;font-weight:750;color:#555}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:white;color:#171717;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#888;box-shadow:0 0 0 3px #00000009}.field textarea{resize:vertical;min-height:64px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.modal-backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.show{display:flex}.modal{background:white;border-radius:18px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{margin:0;font-size:17px}
.step-row{display:flex;gap:8px;align-items:center;margin:7px 0}.step-row input{flex:1;min-width:0;border:1px solid var(--line);padding:8px;border-radius:8px}.step-row button{border:0;background:transparent;color:#777}
.principle{padding:12px 0;border-bottom:1px solid var(--line)}.principle:last-child{border:0}.principle strong{display:block;font-size:13px}.principle p{margin:3px 0 0;color:var(--muted);font-size:12px}
.callout{background:#f4f4f2;border-radius:12px;padding:13px;margin:12px 0}.callout strong{font-size:12px}.callout p{margin:4px 0 0;color:#555;font-size:12px}
.review-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.rating{border:1px solid var(--line);padding:12px;border-radius:12px}.rating label{font-weight:700;font-size:12px;display:block}.rating small{color:var(--muted)}.rating input{width:100%;margin-top:9px}
.day-group{margin-bottom:17px}.day-title{font-weight:750;font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between}
.progress{height:6px;border-radius:10px;background:#eee;overflow:hidden;margin-top:9px}.progress span{height:100%;display:block;background:#222}

.cal-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}.cal-head strong{font-size:13px}
.cal-scroll{height:460px;overflow:auto;border:1px solid var(--line);border-radius:12px;position:relative;background:#fff}
.cal-grid{position:relative}.cal-row{height:24px;border-top:1px solid #f1f1f0;display:flex;cursor:pointer}.cal-row.hour{border-top:1px solid #e3e3e1}.cal-row:hover{background:#fafaf9}
.cal-row span{width:44px;font-size:10px;color:#999;padding:2px 6px;flex:0 0 auto}
.cal-block{position:absolute;border-radius:8px;padding:3px 7px;font-size:11px;line-height:1.3;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;box-shadow:0 1px 2px #0002}
.cal-block.A{background:#991b1b}.cal-block.B{background:#92400e}.cal-block.C,.cal-block.D,.cal-block.E{background:#525252}.cal-block.free{background:#1f4f8a}.cal-block.done{opacity:.45;text-decoration:line-through}
.cal-now{position:absolute;left:44px;right:0;height:2px;background:#dc2626;z-index:2}.cal-now:before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#dc2626}
footer{color:var(--muted);font-size:11px;text-align:center;margin-top:24px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.shell{padding:18px 13px 50px}.header-actions .hide-mobile{display:none}}
@media(max-width:480px){.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:19px}.form-grid,.review-grid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:14px}}
</style>
</head>
<body>
<div class="shell">
<header>
 <div class="brand"><div class="mark">F</div><div><h1>Eat the Frog</h1><div class="sub">Your personal execution system · saved on this device</div></div></div>
 <div class="header-actions"><button class="btn ghost hide-mobile" id="importBtn">Import tasks</button><input type="file" id="importFile" accept=".json,application/json" hidden><button class="btn ghost hide-mobile" id="exportBtn">Export backup</button><button class="btn primary" id="addBtn">＋ Add task</button></div>
</header>
<nav class="tabs" aria-label="Main navigation">
 <button class="tab active" data-tab="execute">Execute</button><button class="tab" data-tab="tasks">All tasks</button><button class="tab" data-tab="completed">📊 Tracker & completed</button><button class="tab" data-tab="principles">Principles & review</button><button class="tab" data-tab="vision">🌅 Vision & rules</button><button class="tab" data-tab="handoff">🤖 Claude handoff</button><button class="tab" data-tab="setup">⚙️ Setup</button>
</nav>
<main id="view"></main>
<footer>Inspired by Brian Tracy's <i>Eat That Frog!</i> · Your data never leaves this browser (localStorage) — no account, no server. Export a backup regularly; clearing browser data erases it.</footer>
</div>

<div class="modal-backdrop" id="blockBackdrop"><section class="modal" role="dialog" aria-modal="true" style="width:min(460px,100%)"><div class="modal-head"><h2 id="blockTitle">Block time</h2><button class="iconbtn" id="closeBlock" aria-label="Close">✕</button></div>
 <input type="hidden" id="bId"><div class="field"><label>TASK</label><select id="bTask"></select></div><div class="field" id="bCustomWrap"><label>OR A CUSTOM BLOCK (e.g. Frog Block, Life Block, Gym)</label><input id="bCustom" maxlength="80" placeholder="Title for a block without a task"></div>
 <div class="form-grid"><div class="field"><label>DATE</label><input id="bDate" type="date"></div><div class="field"><label>START</label><input id="bStart" type="time" step="900"></div><div class="field"><label>DURATION</label><select id="bDur"></select></div><div class="field"><label>REPEAT</label><select id="bRepeat"><option value="0">Once</option><option value="7">Next 7 days</option><option value="5">Next 5 weekdays</option></select></div></div>
 <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:8px"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" id="bTimer" type="button">▶ Start timer</button><a class="btn small" id="bGcal" target="_blank" rel="noopener" style="text-decoration:none">📅 Google Calendar</a><button class="btn small" id="bDelete" type="button" style="color:var(--bad)">Delete</button></div><button class="btn primary" id="bSave" type="button">Save block</button></div></section></div>
<div class="modal-backdrop" id="modalBackdrop">
 <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-head"><h2 id="modalTitle">Create task</h2><button class="iconbtn" id="closeModal" aria-label="Close">✕</button></div>
  <form id="taskForm">
   <input type="hidden" id="taskId">
   <div class="field"><label for="title">TASK *</label><input id="title" required maxlength="140" placeholder="e.g. Write the first draft of the project case study"></div>
   <div class="form-grid">
    <div class="field"><label for="priority">ABCDE PRIORITY</label><select id="priority"><option value="A">A — Must do; serious consequences</option><option value="B">B — Should do; mild consequences</option><option value="C">C — Nice to do; little consequence</option><option value="D">D — Delegate</option><option value="E">E — Eliminate</option></select></div>
    <div class="field"><label for="effort">EFFORT</label><select id="effort"><option value="15">15 min</option><option value="30">30 min</option><option value="60" selected>1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option><option value="240">4 hours</option><option value="480">8+ hours</option></select></div>
    <div class="field"><label for="impact">IMPACT</label><select id="impact"><option value="5">5 — Very high</option><option value="4" selected>4 — High</option><option value="3">3 — Medium</option><option value="2">2 — Low</option><option value="1">1 — Very low</option></select></div>
    <div class="field"><label for="due">DUE DATE (OPTIONAL)</label><input id="due" type="date"></div>
   </div>
   <div class="field"><label for="outcome">CLEAR OUTCOME — WHAT DOES “DONE” MEAN?</label><textarea id="outcome" placeholder="Describe the observable result, not just the activity."></textarea></div>
   <div class="field"><label>CONSEQUENCES OF DELAY — 10 MIN / 10 DAYS / 10 MONTHS / 10 YEARS</label><div class="form-grid">
    <input id="c10m" placeholder="In 10 minutes…"><input id="c10d" placeholder="In 10 days…"><input id="c10mo" placeholder="In 10 months…"><input id="c10y" placeholder="In 10 years…">
   </div></div>
   <div class="field"><label for="weaklink">WEAK LINK / BOTTLENECK — WHAT IS HOLDING YOU BACK?</label><textarea id="weaklink" placeholder="Missing skill, unclear next step, dependency, distraction…"></textarea></div>
   <div class="field"><label for="firstStep">PREPARATION — MAKE STARTING EASY</label><input id="firstStep" placeholder="The first physical action you will take"></div>
   <div class="field"><label for="notes">NOTES / CONTEXT</label><textarea id="notes" placeholder="Useful links, context, constraints…"></textarea></div>
   <div class="field"><label>BREAK IT INTO STEPS (SALAMI SLICES)</label><div id="stepsEditor"></div><button type="button" class="btn small" id="addStep">＋ Add step</button></div>
   <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Save task</button></div>
  </form>
 </section>
</div>
<script type="text/plain" id="handoffText">
# HANDOFF FOR CLAUDE — Eat the Frog execution coach

## Your role
You are my personal execution strategist, productivity coach and task architect — not a motivational speaker.
Help me decide what to actually work on, find what matters most, and convert vague ambitions, problems and ideas into concrete tasks I can execute.
Friendly mentor tone, Hinglish welcome. Direct, practical, honest. Challenge me when I'm avoiding meaningful work.
Don't let me endlessly plan instead of execute. Don't overload me. Don't manufacture dramatic consequences.
If I'm confused about direction, help me explore — don't invent a life goal for me.
"Don't just increase your effort. Identify where your effort is getting blocked."

{{PERSONAL_CONTEXT}}

## What I'll paste below this handoff
My current website data as JSON: tasks (with steps, completedAt = done), KRA ratings, Law of Three, energy check, improvement plan.

## How to work with me each session
1. Read my data. Notice what's completed, stalled (old, no steps ticked), or missing.
2. If I bring a new ambition/problem: understand it first, ask at most ONE focused question if something important is unclear.
3. Evaluate with impact, consequences, effort, opportunity cost, urgency. 80/20. Find the weakest link.
4. Respond with: A) what I'm trying to achieve, B) assessment (what matters, what I'm avoiding, opportunity, weak link), C) tasks, D) exact execution order + what to do immediately, E) what NOT to do, F) one question.
5. Never give "Learn AI"-style tasks. Every step must be independently executable.
6. My future self / role model is in the data as "persona" — use it the way I do: "What would <name> do?". My challenge (length, start, day number, tag) is in "challenge"; daily challenge task titles start with its tag.

## OUTPUT CONTRACT — always end with ONE JSON code block I can paste into the website's "Paste JSON" box
{
  "coachNote": "1-3 lines: the frog for today and why",
  "tasks": [
    {
      "id": "keep the existing id when updating a task; new tasks use a short slug like cf_xxx",
      "title": "Specific, action-oriented (max 140 chars)",
      "priority": "A|B|C|D|E",
      "effort": 15|30|60|90|120|240|480,
      "impact": 1-5,
      "due": "YYYY-MM-DD or empty (only for a genuine deadline)",
      "outcome": "What DONE observably means",
      "consequences": {"m": "10 min", "d": "10 days", "mo": "10 months", "y": "10 years"},
      "weaklink": "What is blocking progress",
      "firstStep": "First physical action",
      "notes": "Context",
      "steps": ["Small sequential step", "..."],
      "completedAt": null
    }
  ],
  "remove": ["id or exact title of tasks to delete — only if I agreed"],
  "blocks": [{"id":"optional","taskId":"task id or null","title":"only for blocks without a task","date":"YYYY-MM-DD","start":"HH:MM","dur":60}]
}
Rules: only include tasks you are adding or changing (unchanged tasks can be left out). Matching is by id, then by title. My ticks on tasks and steps are preserved. To mark a task done set "completedAt" to an ISO date. Optional top-level keys: "vision" {"future":[{"text","task":"task id that builds it"}],"beliefs":[],"insights":[],"rules":[]} — my future-me list, beliefs, self-insights and operating rules (every future-me line should link to a real task; flag lines with no task), "threeActivities" (array of 3), "improvePlan", "energy" {"window","drain"}, "ratings" {"0".."7": 1-10} for the 8 KRAs in this order: Technical depth / system understanding, Problem solving & debugging, Code quality & delivery, System design & architecture, Communication & elaboration, Focus & attention management, Consistency & self-directed execution, Life outside work (home, people, fun, rest).
</script>
<script>
(() => {
const KEY='eatTheFrog.execution.v1';
const principles=[
 ['Clarity','Know exactly what you want to accomplish. Define a visible finish line.'],
 ['Prioritization','Find the task with the greatest impact. Use ABCDE and the Law of Three.'],
 ['Consequences','Consider the cost of delay across 10 minutes, 10 days, 10 months and 10 years.'],
 ['Preparation','Make starting easy: define the first physical action, open the right tools and remove friction.'],
 ['Key result areas','Identify 5–7 capabilities that drive results. Rate yourself honestly from 1–10.'],
 ['Weakest link','Find the skill or constraint limiting progress. Improve that bottleneck, then reassess.'],
 ['Self-directed execution','Set your own standards and deadlines. Don’t wait for someone else to push you.'],
 ['Energy & attention','Track when your energy is highest. Protect focus from notifications and phone loops.'],
 ['Salami slices','Break large goals into small, ordered steps and milestones.'],
 ['Swiss cheese','Make progress in short focused sessions when you cannot finish the whole task.'],
 ['Time blocks','Put important work on the calendar and protect those hours.'],
 ['Urgency','Reduce the gap between deciding and starting. Act promptly without rushing quality.'],
 ['Single handling','Work on one task at a time. Finish a meaningful unit before switching.'],
 ['Be your own supporter','Review mistakes constructively. Redirect attention to the next useful action.']
];
const seed=[
 {title:'Set up your tracker: name your future self',priority:'A',effort:15,impact:5,outcome:'Setup tab filled: future-self name, challenge length and start date, and 5 lines about who you are and what you want.',steps:['Pick a future-self name (or a role model like Hanuman)','Choose challenge length and start date','Write 5 lines in "About me"'],firstStep:'Open the ⚙️ Setup tab.'},
 {title:'Write your ONE goal for the next 6 months',priority:'A',effort:30,impact:5,outcome:'One sentence: the goal that would make you genuinely proud in 6 months, plus why it matters.',steps:['Write 3 candidate goals','Pick one using 80/20','Write why it matters in 2 lines'],firstStep:'Set a 30-min timer and write without editing.'},
 {title:'Rate your key result areas and find your weakest link',priority:'A',effort:15,impact:4,outcome:'All areas rated 1-10 in Principles & review; the weakest one that blocks your goal is named.',steps:[],firstStep:'Open Principles & review.'},
 {title:'Pick tomorrow\'s frog before you sleep',priority:'B',effort:15,impact:4,outcome:'Tomorrow\'s single most important task and its first physical action are written here.',steps:[],firstStep:'Look at your goal and ask: what one task moves it most?'}
].map(x=>({...x,id:uid(),createdAt:new Date().toISOString(),completedAt:null,due:'',notes:'',weaklink:''}));
function uid(){return 't_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function dateKey(d=new Date()){return d.toLocaleDateString('en-CA')}
function safeParse(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
const firstVisit=!safeParse();
let data=safeParse()||{tasks:seed,ratings:{},threeActivities:['','',''],energy:{},createdAt:new Date().toISOString()};
if(!Array.isArray(data.tasks))data.tasks=seed;
let activeTab=firstVisit?'setup':'execute',filter='all';
function persona(){const p=data.persona||{};return{name:(p.name||'Future Me').trim()||'Future Me',emoji:p.emoji||'🌅'}}
function chal(){const c=data.challenge||{};return{days:Number(c.days)||50,start:c.start||'',tag:(c.tag||'Daily').trim()||'Daily'}}
function chalDay(){const c=chal();if(!c.start)return null;const d=Math.floor((new Date(dateKey()+'T12:00:00')-new Date(c.start+'T12:00:00'))/864e5)+1;return d}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function dayLabel(key){const d=new Date(key+'T12:00:00');return d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'short',day:'numeric'})}
function openModal(task=null){
 $('taskForm').reset();$('stepsEditor').innerHTML='';$('taskId').value=task?.id||'';
 $('modalTitle').textContent=task?'Edit task':'Create task';
 const fields={title:'title',priority:'priority',effort:'effort',impact:'impact',due:'due',outcome:'outcome',weaklink:'weaklink',firstStep:'firstStep',notes:'notes'};
 Object.entries(fields).forEach(([k,id])=>$(id).value=task?.[k]??({priority:'A',effort:'60',impact:'4'}[k]||''));
 $('c10m').value=task?.consequences?.m||'';$('c10d').value=task?.consequences?.d||'';$('c10mo').value=task?.consequences?.mo||'';$('c10y').value=task?.consequences?.y||'';
 (task?.steps||[]).forEach(s=>addStepInput(s));$('modalBackdrop').classList.add('show');$('title').focus();
}
function closeModal(){$('modalBackdrop').classList.remove('show')}
function addStepInput(value=''){const row=document.createElement('div');row.className='step-row';row.innerHTML='<input maxlength="180" placeholder="A small, actionable step" value="'+esc(value)+'"><button type="button" aria-label="Remove step">✕</button>';row.querySelector('button').onclick=()=>row.remove();$('stepsEditor').appendChild(row)}
function saveTask(e){e.preventDefault();const id=$('taskId').value;const old=data.tasks.find(t=>t.id===id);const task={id:id||uid(),title:$('title').value.trim(),priority:$('priority').value,effort:Number($('effort').value),impact:Number($('impact').value),due:$('due').value,outcome:$('outcome').value.trim(),consequences:{m:$('c10m').value.trim(),d:$('c10d').value.trim(),mo:$('c10mo').value.trim(),y:$('c10y').value.trim()},weaklink:$('weaklink').value.trim(),firstStep:$('firstStep').value.trim(),notes:$('notes').value.trim(),steps:[...$('stepsEditor').querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean).map((title,i)=>({id:uid(),title,done:old?.steps?.find(s=>s.title===title)?.done||false,doneAt:old?.steps?.find(s=>s.title===title)?.doneAt||null})),createdAt:old?.createdAt||new Date().toISOString(),completedAt:old?.completedAt||null};
 if(old)Object.assign(old,task);else data.tasks.unshift(task);save();closeModal();render()}

 <div class="section-title">Edit (one item per line)</div><div class="tiny">Future-me lines keep their task links by position.</div>${list(v.future,'future')}${list(v.beliefs,'beliefs')}${list(v.insights,'insights')}${list(v.rules,'rules')}<button class="btn primary" style="width:100%" data-action="saveVision">Save vision & rules</button></aside></div>`}
let timer=null,timerEnd=0,timerKind='focus',pausedLeft=0;
function pauseTimer(){const btn=document.getElementById('pauseBtn');const el=document.getElementById('timerOut');if(timer){pausedLeft=Math.max(0,timerEnd-Date.now());clearInterval(timer);timer=null;const m=Math.floor(pausedLeft/60000),s2=Math.floor(pausedLeft%60000/1000);const txt=String(m).padStart(2,'0')+':'+String(s2).padStart(2,'0');if(el)el.textContent='Paused at '+txt+' — resume soon, don\'t let it drift';document.title='❚❚ '+txt+' Eat the Frog';if(btn)btn.textContent='▶ Resume'}else if(pausedLeft>0){startTimer(pausedLeft/60000,timerKind);if(btn)btn.textContent='❚❚ Pause'}}
function startTimer(min,kind='focus'){pausedLeft=0;const pb=document.getElementById('pauseBtn');if(pb)pb.textContent='❚❚ Pause';timerKind=kind;timerEnd=Date.now()+min*60000;clearInterval(timer);const tick=()=>{const left=Math.max(0,timerEnd-Date.now());const m=Math.floor(left/60000),s2=Math.floor(left%60000/1000);const el=document.getElementById('timerOut');const txt=String(m).padStart(2,'0')+':'+String(s2).padStart(2,'0');const isBreak=timerKind==='break';if(el)el.textContent=isBreak?'Break: '+txt+' — stand up, water, no phone scrolling':'Focus: '+txt+' — single-handle it';document.title=(left?txt+(isBreak?' ☕ ':' 🐸 '):'')+'Eat the Frog';if(!left){clearInterval(timer);timer=null;alert(isBreak?'Break over! Back to the frog — start the next focus session now.':'Time! Tick the steps you finished. Then take a 5-min break before the next slice.')}};tick();timer=setInterval(tick,1000)}
const PRESETS=[['Future Me','🌅'],['Hanuman','🙏'],['Arjuna','🏹'],['Krishna','🪈'],['The Warrior','⚔️'],['The Monk','🧘']];
function P(id,title,pr,eff,imp,outcome,first,steps,weak){return{id,title,priority:pr,effort:eff,impact:imp,outcome,firstStep:first,steps,weaklink:weak||'',notes:'Starter pack task — edit it to fit your life.'}}
function starterPacks(){const T=chal().tag;return{
 focus:{name:'🎯 Focus & discipline',tasks:[
  P('sp_phone','Design your phone environment against cheap dopamine','A',30,5,'App limits on social apps, charger outside the bedroom, phone in another room during deep work.','Open Screen Time / Digital Wellbeing now.',['Set app limits','Move charger out of bedroom','Pick a phone spot for deep work'],'Attention leaks to the phone.'),
  P('sp_frogblock','Set up a daily 90-min Frog Block','A',30,5,'Recurring calendar block at your best energy hour: phone out, one task.','Create the calendar event.',['Track energy for 3 days','Pick the slot','Create recurring event'],'No protected deep-work time.'),
  P('sp_morning',T+' · No phone for the first 60 minutes after waking','A',15,5,'Every day of the challenge, phone stays away for 60 min after waking.','Use a separate alarm clock tonight.',['Week 1','Week 2','Week 3','Week 4'],'The day starts reactive.'),
  P('sp_urge',T+' · Wait 90 seconds before any cheap-pleasure urge','B',15,4,'Pause 90 sec, name the cue, then decide. Tally urges in Notes.','Set lock-screen text: "Wait 90 sec".',['Week 1','Week 2','Week 3','Week 4'],'No gap between urge and action.')]},
 career:{name:'💼 Career growth',tasks:[
  P('sp_portfolio','Publish one project case study + 2-min demo','A',240,5,'Public write-up (problem, approach, results, lessons) + short demo video + one post sharing it.','Open a doc and write 5 headings.',['Facts under each heading','Diagram','Full draft','Record demo','Publish + post'],'Your best work is invisible.'),
  P('sp_skill',T+' · 45 min deliberate practice on your #1 skill','A',45,5,'Daily focused practice on the one skill that limits your goal, with a 1-line log of what got better.','Name the skill in Notes.',['Week 1','Week 2','Week 3','Week 4'],'Practising what is comfortable, not what is limiting.'),
  P('sp_stories','Write 5 STAR stories from your work','B',90,4,'Five 2-minute stories with Situation, Task, Action, Result (numbers).','Write the proudest one first.',['Story 1','Story 2','Story 3','Story 4','Story 5'],'Achievements not packaged.'),
  P('sp_apply','Send 5 strong applications or 5 networking messages','B',120,4,'5 tailored applications or referral messages sent and tracked.','Make a sheet: Company | Role | Status.',['List 15 targets','Send 5'],'Waiting to feel ready.')]},
 voice:{name:'🗣️ Communication & confidence',tasks:[
  P('sp_voice',T+' · 15-min voice routine + 3-min recorded talk','A',15,4,'Warm-up, articulation drills, then 3 minutes speaking on a topic without notes, recorded.','Record a 3-min baseline today.',['Week 1','Week 2','Week 3','Week 4','Compare first vs last recording'],'Practice stays theoretical.'),
  P('sp_convo',T+' · One real 5-minute conversation a day','A',15,4,'Daily real conversation — ask open questions, listen to understand.','Ask one colleague a genuine question today.',['Week 1','Week 2','Week 3','Week 4'],'Fear of people, practice only alone.'),
  P('sp_speakfirst','Speak first in 3 meetings this week','B',15,4,'In 3 meetings you speak in the first 5 minutes.','Write one question before the next meeting.',['Meeting 1','Meeting 2','Meeting 3'],'Waiting for the perfect thing to say.')]},
 life:{name:'🌿 Life outside work',tasks:[
  P('sp_braindump','30-min brain-dump of every pending life task','A',30,5,'One list of all open loops (chores, bills, calls, replies), each tagged 10-min / 1-hr / bigger.','Open a note called "Life backlog".',['Dump everything','Tag each item','Pick 3 for this week'],'Open loops cause hidden mental fatigue.'),
  P('sp_lifeblock',T+' · Daily Life Block: close loops, people, body, wind-down','A',120,5,'Protected evening time: 20-30 min backlog items, then people or hobby, then movement, then wind-down.','Add a recurring "Life Block" to the calendar.',['Week 1','Week 2','Week 3','Week 4'],'Life outside work gets only leftovers.'),
  P('sp_sleep',T+' · Fixed wake time + screens off 30 min before bed','A',15,5,'Same wake time daily; last 30 minutes before sleep without screens.','Set a repeating wind-down alarm.',['Week 1','Week 2','Week 3','Week 4'],'Bad sleep drives bad mood and cravings.'),
  P('sp_friend','Meet a friend in person every week','B',120,4,'One offline meetup per week, phone away.','Message two friends now.',['Week 1','Week 2','Week 3','Week 4'],'Social life left to chance.')]},
 mind:{name:'🧠 Mind & self-talk',tasks:[
  P('sp_meditate',T+' · 10-min meditation','B',15,4,'10 minutes daily, breath focus or 5-4-3-2-1 grounding.','Stack it right after brushing teeth.',['Week 1','Week 2','Week 3','Week 4'],'Mind wandering and overthinking.'),
  P('sp_journal',T+' · Night journal: 3 wins, 1 hard thing, 1 lesson (third person)','B',15,3,'Every night: "'+persona().name+' did ___" ×3, one hard thing and what you will do about it, one lesson.','Keep a notebook by the bed.',['Week 1','Week 2','Week 3','Week 4'],'Self-talk focused only on gaps.'),
  P('sp_scorecard',T+' · Nightly scorecard: rate your non-negotiables + mood','A',15,5,'Each night score your daily habits out of 5 and mood 1-10 in Notes. Never miss twice.','Write tonight\'s score, even if it is 0.',['Week 1','Week 2','Week 3','Week 4'],'No feedback loop.')]}
}}
function renderSetup(){const p=persona(),c=chal(),packs=starterPacks();const have=new Set(data.tasks.map(t=>t.id));
 return `${firstVisit?`<div class="callout" style="background:#171717;color:#fff;margin-bottom:18px"><strong style="color:#fff">🐸 Welcome to Eat the Frog</strong><p style="color:#ddd">Three steps: 1) name the future self you're becoming, 2) set your challenge, 3) add a starter pack. Then go to Execute and eat your first frog. Everything stays in this browser.</p></div>`:''}
 <div class="grid"><section class="panel"><h2>${p.emoji} Your future self</h2><div class="sub">Name the person you're becoming — your future self or a role model whose strength you want to practise. The app asks "What would ${esc(p.name)} do?" every day.</div>
 <div class="task-meta" style="margin:12px 0">${PRESETS.map(([n,e])=>`<button class="btn small ${p.name===n?'primary':''}" data-action="preset" data-name="${esc(n)}" data-emoji="${e}">${e} ${esc(n)}</button>`).join('')}</div>
 <div class="form-grid"><div class="field"><label>NAME</label><input id="pName" value="${esc(p.name)}" maxlength="40"></div><div class="field"><label>EMOJI</label><input id="pEmoji" value="${esc(p.emoji)}" maxlength="4"></div></div>
 <div class="section-title">Challenge</div><div class="form-grid"><div class="field"><label>LENGTH (DAYS)</label><select id="cDays">${[21,30,50,75,100].map(n=>`<option ${c.days===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>START DATE</label><input id="cStart" type="date" value="${esc(c.start)}"></div><div class="field full"><label>TAG FOR DAILY CHALLENGE TASKS (titles start with it)</label><input id="cTag" value="${esc(c.tag)}" maxlength="12"></div></div>
 <div class="section-title">About me (goes into the Claude handoff)</div><div class="field"><textarea id="aboutMe" style="min-height:140px" placeholder="Who you are, what you do, your big goals, your known weaknesses. 5-10 lines is enough.">${esc(data.handoffContext||'')}</textarea></div>
 <button class="btn primary" style="width:100%" data-action="saveSetup">Save setup</button></section>
 <aside class="panel"><h2>📦 Starter packs</h2><div class="sub">Pick 1-2 packs, not all. Each adds ready-made tasks with outcomes, first steps and salami-sliced steps. Edit them freely.</div>
 ${Object.entries(packs).map(([k,pk])=>{const n=pk.tasks.filter(t=>!have.has(t.id)).length;return `<div class="principle" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><strong>${pk.name}</strong><p>${pk.tasks.length} tasks · ${pk.tasks.filter(t=>t.priority==='A').length} A</p></div><button class="btn small ${n?'primary':''}" data-action="addPack" data-pack="${k}" ${n?'':'disabled'}>${n?'Add':'Added ✓'}</button></div>`}).join('')}
 <div class="callout"><strong>Don't overload</strong><p>One frog at a time. More tasks ≠ more progress. Start with one pack for the first week.</p></div></aside></div>`}
function handoffPayload(){const t=document.getElementById('handoffText').textContent.trim().replace('{{PERSONAL_CONTEXT}}',data.handoffContext||'## Who I am\n(Not set yet — fill "About me" in the Setup tab.)');const snap={today:dateKey(),calendarBlocks:blocks().filter(b=>b.date>=dateKey()).slice(0,60),persona:persona(),challenge:{...chal(),day:chalDay()},vision:vis(),tasks:data.tasks,ratings:data.ratings,threeActivities:data.threeActivities,energy:data.energy,improvePlan:data.improvePlan||'',coachNote:data.coachNote||''};return t+'\n\n## MY CURRENT DATA ('+dateKey()+')\n```json\n'+JSON.stringify(snap,null,1)+'\n```\n\n## WHAT I WANT TODAY\n(write here: completed tasks, new ambition, problem, or "what next")\n'}
function renderHandoff(){const open=data.tasks.filter(t=>!t.completedAt).length;return `<div class="grid"><section class="panel"><div class="panel-head"><div><h2>Talk to Claude</h2><div class="sub">1) Copy the handoff — it carries the coaching prompt, your notes and all ${data.tasks.length} tasks (${open} open). 2) Paste it into a new Claude chat and add what you want. 3) Paste Claude's JSON reply on the right.</div></div><button class="btn primary small" data-action="copyHandoff">Copy handoff + my data</button></div>${data.coachNote?`<div class="callout"><strong>🐸 Last coach note</strong><p>${esc(data.coachNote)}</p></div>`:''}<textarea id="handoffBox" readonly style="width:100%;min-height:420px;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#333;background:#fafafa">${esc(handoffPayload())}</textarea></section>
 <aside class="panel"><h2>Paste Claude's JSON</h2><div class="sub">Paste the whole reply or just the JSON block. Tasks merge by id/title; your ticks are kept.</div><div class="field" style="margin-top:12px"><textarea id="pasteJson" style="min-height:300px;font:12px/1.5 ui-monospace,Menlo,monospace" placeholder='{"tasks":[ ... ]}'></textarea></div><button class="btn primary" style="width:100%" data-action="importPasted">Import pasted JSON</button><div class="callout"><strong>Tip</strong><p>Export a backup before big changes. The handoff text lives inside this HTML file, so it travels with the website.</p></div></aside></div>`}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);return true}catch(e){const ta=$('handoffBox');if(!ta)return false;ta.removeAttribute('readonly');ta.focus();ta.select();const ok=document.execCommand('copy');ta.setAttribute('readonly','');return ok}}
function extractJson(raw){const fence=raw.match(/```(?:json)?\s*([\s\S]*?)```/g);const candidates=fence?fence.map(f=>f.replace(/```(?:json)?/,'').replace(/```$/,'').trim()):[];candidates.push(raw.trim());const a=raw.indexOf('{'),b=raw.lastIndexOf('}');if(a>-1&&b>a)candidates.push(raw.slice(a,b+1));for(const c of candidates.reverse()){try{return JSON.parse(c)}catch(e){}}throw new Error('No valid JSON found. Paste the JSON code block from Claude.')}
function render(){const view=$('view');setTimeout(()=>{const sc=document.getElementById('calScroll');if(sc&&!sc.dataset.s){const n=new Date();const m=calDate===dateKey()?n.getHours()*60+n.getMinutes()-90:8*60;sc.scrollTop=Math.max(0,(m-CAL_START*60)/30*ROWH);sc.dataset.s=1}},0);view.innerHTML=activeTab==='execute'?renderExecute():activeTab==='tasks'?renderTasks():activeTab==='completed'?renderCompleted():activeTab==='handoff'?renderHandoff():activeTab==='vision'?renderVision():activeTab==='setup'?renderSetup():renderPrinciples();document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab))}
function setTab(t){activeTab=t;render()}
function toggleComplete(id){const t=data.tasks.find(t=>t.id===id);if(!t)return;t.completedAt=t.completedAt?null:new Date().toISOString();save();render()}
function handleAction(action,id){const t=data.tasks.find(t=>t.id===id);if(action==='add')openModal();if(action==='edit'&&t)openModal(t);if(action==='complete')toggleComplete(id);if(action==='delete'&&t&&confirm('Delete this task permanently?')){data.tasks=data.tasks.filter(x=>x.id!==id);save();render()}if(action==='steps'&&t){const next=t.steps?.find(s=>!s.done);if(!t.steps?.length){openModal(t);return}if(next){next.done=true;next.doneAt=new Date().toISOString();save();render()}else alert('All steps are complete. Mark the task complete when the outcome is achieved.')}if(action==='saveThree'){data.threeActivities=[0,1,2].map(i=>document.querySelector(`[data-three="${i}"]`).value.trim());save();alert('Your three activities are saved.')}if(action==='saveImprove'){data.improvePlan=$('improvePlan').value;save();alert('Improvement plan saved.')}if(action==='preset'){const b=document.activeElement;}if(action==='saveSetup'){data.persona={name:$('pName').value.trim(),emoji:$('pEmoji').value.trim()};data.challenge={days:Number($('cDays').value),start:$('cStart').value,tag:$('cTag').value.trim()};data.handoffContext=$('aboutMe').value.trim();save();render();alert('Setup saved.')}if(action==='addPack'){const pk=starterPacks()[id];if(pk){const have=new Set(data.tasks.map(t=>t.id));let n=0;pk.tasks.forEach(t=>{if(!have.has(t.id)){data.tasks.push({...t,due:'',consequences:{m:'',d:'',mo:'',y:''},steps:t.steps.map(x=>({id:uid(),title:x,done:false})),createdAt:new Date().toISOString(),completedAt:null});n++}});save();render();alert(n+' tasks added. Go to Execute — your frog is at the top.')}}if(action==='calPrev'){calDate=shiftDay(calDate,-1);render()}if(action==='calNext'){calDate=shiftDay(calDate,1);render()}if(action==='calToday'){calDate=dateKey();render()}if(action==='calAdd')openBlock({});if(action==='calSlot')openBlock({start:m2hm(Number(id))});if(action==='blockTask'&&t)openBlock({taskId:t.id,dur:t.effort});if(action==='calEdit'){const b=blocks().find(x=>x.id===id);if(b)openBlock(b)}if(action==='calIcs'){const blob=new Blob([icsFor(calDate)],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='frog-blocks-'+calDate+'.ics';a.click();URL.revokeObjectURL(a.href)}if(action==='timer25')startTimer(25);if(action==='break5')startTimer(5,'break');if(action==='break10')startTimer(10,'break');if(action==='timerPause')pauseTimer();if(action==='timerStop'){clearInterval(timer);timer=null;pausedLeft=0;const pb=document.getElementById('pauseBtn');if(pb)pb.textContent='❚❚ Pause';document.title='Eat the Frog';const el=document.getElementById('timerOut');if(el)el.textContent='Timer stopped.'}if(action==='timer90')startTimer(90);if(action==='saveVision'){const v=vis();const get=k=>document.querySelector(`[data-vision="${k}"]`).value.split('\n').map(x=>x.trim()).filter(Boolean);const fut=get('future').map((t,i)=>({text:t,task:(v.future[i]&&v.future[i].task)||''}));data.vision={future:fut,beliefs:get('beliefs'),insights:get('insights'),rules:get('rules')};save();render();alert('Vision saved.')}if(action==='copyHandoff'){copyText(handoffPayload()).then(ok=>alert(ok?'Handoff copied. Paste it into a new Claude chat.':'Copy failed — select the text box and copy manually.'))}if(action==='importPasted'){try{if(importData(extractJson($('pasteJson').value),'paste'))$('pasteJson').value=''}catch(err){alert(err.message)}}if(action==='saveEnergy'){data.energy={window:$('energyWindow').value,drain:$('energyDrain').value};save();alert('Energy check saved.')}}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const a=e.target.closest('[data-action]');if(a&&a.dataset.action==='preset'){$('pName').value=a.dataset.name;$('pEmoji').value=a.dataset.emoji;return}if(a&&a.dataset.action==='addPack'){handleAction('addPack',a.dataset.pack);return}if(a)handleAction(a.dataset.action,a.dataset.id)});
document.addEventListener('input',e=>{if(e.target.matches('[data-rating]')){const i=e.target.dataset.rating;data.ratings[i]=Number(e.target.value);const el=$('ratingVal'+i);if(el)el.textContent=e.target.value+'/10';const box=$('weakestBox');if(box){const areas=['Technical depth / system understanding','Problem solving & debugging','Code quality & delivery','System design & architecture','Communication & elaboration','Focus & attention management','Consistency & self-directed execution','Life outside work (home, people, fun, rest)'];box.innerHTML=weakestText(areas,data.ratings)}save()}});
$('addBtn').onclick=()=>openModal();$('closeBlock').onclick=closeBlock;$('bSave').onclick=saveBlock;$('blockBackdrop').addEventListener('click',e=>{if(e.target===$('blockBackdrop'))closeBlock()});$('bTask').onchange=()=>{$('bCustomWrap').style.opacity=$('bTask').value?'.4':'1';const t=data.tasks.find(x=>x.id===$('bTask').value);if(t&&!$('bId').value){const c=[15,25,30,45,60,90,120,180,240];$('bDur').value=c.reduce((a,v)=>Math.abs(v-t.effort)<Math.abs(a-t.effort)?v:a,60)}};$('bDelete').onclick=()=>{data.blocks=blocks().filter(x=>x.id!==$('bId').value);save();closeBlock();render()};$('bTimer').onclick=()=>{const b=blocks().find(x=>x.id===$('bId').value);closeBlock();setTab('execute');if(b)startTimer(Number(b.dur))};$('addStep').onclick=()=>addStepInput();$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});$('taskForm').onsubmit=saveTask;
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eat-the-frog-backup-'+dateKey()+'.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('importFile').click();
function importData(j,source){
 const incoming=Array.isArray(j)?j:(j.tasks||[]);const removes=Array.isArray(j)?[]:(j.remove||[]);
 if(!incoming.length&&!removes.length){alert('No tasks found in this '+source+'.');return false}
 if(!confirm('Merge '+incoming.length+' task(s)'+(removes.length?' and remove '+removes.length:'')+' from this '+source+'? Existing tasks stay; tasks with the same id or title get updated. Your ticks are kept.'))return false;
 let added=0,updated=0,removed=0;const P=['A','B','C','D','E'];
 incoming.forEach(raw=>{if(!raw||!raw.title)return;const t={id:raw.id||uid(),title:String(raw.title).slice(0,140),priority:P.includes(raw.priority)?raw.priority:'B',effort:Number(raw.effort)||60,impact:Math.min(5,Math.max(1,Number(raw.impact)||3)),due:raw.due||'',outcome:raw.outcome||'',consequences:{m:raw.consequences?.m||'',d:raw.consequences?.d||'',mo:raw.consequences?.mo||'',y:raw.consequences?.y||''},weaklink:raw.weaklink||'',firstStep:raw.firstStep||'',notes:raw.notes||'',steps:(raw.steps||[]).map(s=>typeof s==='string'?{id:uid(),title:s,done:false}:{id:s.id||uid(),title:s.title,done:!!s.done}).filter(s=>s.title),createdAt:raw.createdAt||new Date().toISOString(),completedAt:raw.completedAt||null};
  const old=data.tasks.find(x=>x.id===t.id)||data.tasks.find(x=>x.title.trim().toLowerCase()===t.title.trim().toLowerCase());
  if(old){const keepDone=old.completedAt;const doneSteps=new Set((old.steps||[]).filter(s=>s.done).map(s=>s.title));Object.assign(old,t,{id:old.id,createdAt:old.createdAt,completedAt:keepDone||t.completedAt});old.steps.forEach(s=>{if(doneSteps.has(s.title))s.done=true});updated++}else{data.tasks.push(t);added++}});
 removes.forEach(r=>{const k=String(r).trim().toLowerCase();const before=data.tasks.length;data.tasks=data.tasks.filter(x=>x.id!==r&&x.title.trim().toLowerCase()!==k);removed+=before-data.tasks.length});
 if(!Array.isArray(j)){if(Array.isArray(j.threeActivities))data.threeActivities=j.threeActivities;if(j.improvePlan)data.improvePlan=j.improvePlan;if(j.energy)data.energy=j.energy;if(j.ratings)data.ratings=j.ratings;if(j.coachNote)data.coachNote=j.coachNote;if(typeof j.handoffContext==='string')data.handoffContext=j.handoffContext;if(j.persona)data.persona=j.persona;if(j.challenge)data.challenge=j.challenge;if(Array.isArray(j.blocks)){j.blocks.forEach(b=>{if(!b||!b.date||!b.start)return;const nb={id:b.id||uid(),taskId:b.taskId||null,title:b.title||'',date:b.date,start:b.start,dur:Number(b.dur)||60};const o=blocks().find(x=>x.id===nb.id);if(o)Object.assign(o,nb);else blocks().push(nb)})}if(j.vision&&typeof j.vision==='object')data.vision={...vis(),...j.vision};}
 save();render();alert('Imported: '+added+' added, '+updated+' updated'+(removes.length?', '+removed+' removed':'')+'.');return true}
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{importData(JSON.parse(await f.text()),'file')}catch(err){alert('Could not read this file: '+err.message)}finally{e.target.value=''}};
render();
})();
</script>
